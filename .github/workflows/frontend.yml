name: Frontend CI/CD

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:run

  docker:
    name: Build & Push
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/jumaelmartins/portfolio-manager-frontend:latest
            ghcr.io/jumaelmartins/portfolio-manager-frontend:sha-${{ github.sha }}

  deploy:
    name: Deploy
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # CR_PAT must be a classic PAT with scope: read:packages
      # The SSH connection to the VPS is intermittently flaky (transient
      # "dial tcp :22 i/o timeout"). Try once, then retry after a short
      # backoff before failing the job. The script is idempotent, so a
      # partial first attempt is safe to re-run.
      - name: Deploy to VPS
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CR_PAT
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "$CR_PAT" | docker login ghcr.io -u jumaelmartins --password-stdin
            cd /opt/portfolio-manager
            docker compose -f docker-compose.prod.yml pull frontend
            docker compose -f docker-compose.prod.yml stop frontend
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend

      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to VPS (retry)
        if: steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CR_PAT
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "$CR_PAT" | docker login ghcr.io -u jumaelmartins --password-stdin
            cd /opt/portfolio-manager
            docker compose -f docker-compose.prod.yml pull frontend
            docker compose -f docker-compose.prod.yml stop frontend
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend
